services:
  - type: web
    name: kumamoto-disaster-portal
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node server/portal-server.js
    autoDeploy: true
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/phase1_updates.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/communication_status.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/status.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/x_feed_preview.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/disaster_locations.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/water_cross_view.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/water_search_index.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/disaster_search_index.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /data/public/disaster_post_index.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
