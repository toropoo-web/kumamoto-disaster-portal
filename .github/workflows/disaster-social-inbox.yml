name: Disaster Social Inbox Operation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disaster-social-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inbox-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Fetch disaster social SNS inbox
        run: npm run fetch:disaster-social-sns -- --merge

      - name: Validate inbox schema
        run: npm run validate:disaster-social-inbox-schema

      - name: Validate disaster social pipeline
        run: npm run validate:disaster-social-pipeline

      - name: Build review queue from inbox
        run: npm run review:disaster-social-queue

      - name: Operation monitor
        run: npm run monitor:disaster-social-operation

      - name: Commit review queue updates
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community/disaster_social_inbox.json
          git add data/community/disaster_social_review_queue.json
          git add data/community/disaster_social_apply_queue.json
          git add data/operation_monitor/disaster-social-operation.json
          STAGED="$(git diff --cached --name-only)"
          if [ -z "$STAGED" ]; then
            echo "NO_REVIEW_QUEUE_CHANGES"
            exit 0
          fi
          git commit -m "chore: update disaster social review queue"
          git push
          echo "REVIEW_QUEUE_UPDATED=true"

      - name: Operation summary
        run: |
          echo "DISASTER_SOCIAL_INBOX_OPERATION=COMPLETE"
          echo "AUTO_APPLY=false"
          echo "STOP_AT=REVIEW_QUEUE"
