name: Disaster Social Inbox Operation

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disaster-social-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inbox-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Sync cross-search production pipeline
        run: node scripts/sync-disaster-social-cross-search-production.js

      - name: Validate open acquisition configuration
        run: node scripts/validate-disaster-x-cross-search-open-acquisition.js

      - name: Validate inbox schema
        run: npm run validate:disaster-social-inbox-schema

      - name: Validate disaster social pipeline
        continue-on-error: true
        run: npm run validate:disaster-social-pipeline

      - name: Operation monitor
        run: npm run monitor:disaster-social-operation

      - name: Commit review queue updates
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community/disaster_social_inbox.json
          git add data/community/disaster_social_index.json
          git add data/community/disaster_social_sources.json
          git add data/public/disaster_social_index.json
          git add data/public/disaster_social_sources.json
          git add data/community/disaster_social_review_queue.json
          git add data/community/disaster_social_apply_queue.json
          git add data/operation_monitor/disaster-social-operation.json
          STAGED="$(git diff --cached --name-only)"
          if [ -z "$STAGED" ]; then
            echo "NO_REVIEW_QUEUE_CHANGES"
            exit 0
          fi
          git commit -m "chore: sync disaster social cross-search index"
          git push
          echo "REVIEW_QUEUE_UPDATED=true"

      - name: Operation summary
        run: |
          echo "DISASTER_SOCIAL_INBOX_OPERATION=COMPLETE"
          echo "AUTO_APPLY=true"
          echo "STOP_AT=DISASTER_SOCIAL_INDEX"
