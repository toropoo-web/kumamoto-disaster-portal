name: Auto Patrol

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
    inputs:
      auto_apply:
        description: Apply auto-approved municipality updates to phase1_updates.json
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  patrol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AUTO_APPLY_ENABLED: ${{ github.event_name == 'schedule' || github.event.inputs.auto_apply == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Restore patrol snapshot cache
        id: patrol-cache
        uses: actions/cache@v4
        with:
          path: |
            monitor/reports/snapshots.json
            monitor/reports/emergency-snapshots.json
            monitor/reports/infrastructure-snapshots.json
          key: patrol-snapshots-${{ github.ref }}
          restore-keys: |
            patrol-snapshots-${{ github.ref }}
            patrol-snapshots-refs/heads/main

      - name: Seed patrol snapshots when cache is cold
        run: node scripts/seed-patrol-snapshots.js

      - name: Run patrol and generate reports
        id: patrol
        run: |
          set -e
          npm run patrol | tee patrol-output.log
          if grep -q "HIGH_PRIORITY_CHANGES_FOUND" patrol-output.log; then
            echo "high_alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "high_alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate review queue
        run: npm run review

      - name: Run URL audit
        run: npm run url-audit

      - name: Auto-apply preview
        run: node scripts/auto-apply-candidates.js

      - name: Auto-apply municipality updates
        if: env.AUTO_APPLY_ENABLED == 'true'
        run: node scripts/auto-apply-candidates.js --apply

      - name: Sync public status from patrol report
        run: node scripts/sync-patrol-public-status.js

      - name: Build public search indices
        if: env.AUTO_APPLY_ENABLED == 'true'
        run: npm run build

      - name: Run publication validation
        if: env.AUTO_APPLY_ENABLED == 'true'
        run: npm test

      - name: Publish public patrol data
        run: |
          set -e
          node scripts/validate-public-status.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/status.json
          if [ "$AUTO_APPLY_ENABLED" = "true" ]; then
            git add data/public/phase1_updates.json || true
            git add data/public/disaster_locations.json || true
            git add data/public/water_cross_view.json data/public/water_search_index.json data/public/disaster_search_index.json || true
          fi
          STAGED="$(git diff --cached --name-only)"
          if [ -z "$STAGED" ]; then
            echo "NO_PUBLIC_DATA_CHANGES"
            exit 0
          fi
          node scripts/verify-public-commit-staging.js
          git commit -m "chore: publish patrol public data"
          git push

      - name: Validate patrol and operation infrastructure
        run: |
          node scripts/validate-patrol.js
          node scripts/validate-operation.js
          node scripts/validate-url-audit.js
          node scripts/validate-post-apply.js
          node scripts/validate-patrol-publish-pipeline.js

      - name: Log patrol summary on failure
        if: failure()
        run: |
          echo "Patrol workflow failed. Recent artifacts:"
          ls -la monitor/reports/ || true
          ls -la operations/patrol/ || true
          cat monitor/reports/patrol-error-report.json || true
          cat monitor/reports/daily-report.md || true
          cat monitor/reports/source-failures.md || true

      - name: Upload patrol artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-reports-${{ github.run_id }}
          path: |
            monitor/reports/
            monitor/change-log/
            data/update_candidates/
            data/approved/auto-preview/
            operations/patrol/
            operations/url-audit/
            patrol-output.log
