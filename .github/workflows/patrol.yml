name: Auto Patrol

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Restore patrol snapshot cache
        uses: actions/cache@v4
        with:
          path: |
            monitor/reports/snapshots.json
            monitor/reports/emergency-snapshots.json
            monitor/reports/infrastructure-snapshots.json
          key: patrol-snapshots-${{ github.ref }}
          restore-keys: |
            patrol-snapshots-${{ github.ref }}
            patrol-snapshots-refs/heads/main

      - name: Seed patrol snapshots when cache is cold
        run: node scripts/seed-patrol-snapshots.js

      - name: Run patrol and generate reports
        id: patrol
        run: |
          set -e
          npm run patrol | tee patrol-output.log
          if grep -q "HIGH_PRIORITY_CHANGES_FOUND" patrol-output.log; then
            echo "high_alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "high_alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate review queue
        run: npm run review

      - name: Run URL audit
        run: npm run url-audit

      - name: Validate patrol and operation infrastructure
        run: |
          node scripts/validate-patrol.js
          node scripts/validate-operation.js
          node scripts/validate-url-audit.js
          node scripts/validate-post-apply.js
          node scripts/validate-patrol-publish-pipeline.js

      - name: Log patrol summary on failure
        if: failure()
        run: |
          echo "Patrol workflow failed. Recent artifacts:"
          ls -la monitor/reports/ || true
          ls -la operations/patrol/ || true
          cat monitor/reports/daily-report.md || true
          cat monitor/reports/source-failures.md || true

      - name: Upload patrol artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-reports-${{ github.run_id }}
          path: |
            monitor/reports/
            monitor/change-log/
            data/update_candidates/
            operations/patrol/
            operations/url-audit/
            patrol-output.log
