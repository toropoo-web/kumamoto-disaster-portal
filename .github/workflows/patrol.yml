name: Auto Patrol

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run patrol
        run: npm run patrol

      - name: Generate review queue
        run: npm run review

      - name: Validate patrol infrastructure
        run: node scripts/validate-patrol.js

      - name: Upload patrol artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-reports
          path: |
            monitor/reports/
            monitor/change-log/
            data/update_candidates/
