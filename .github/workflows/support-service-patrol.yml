name: Support Service Patrol

on:
  schedule:
    # JST 06:00 (UTC 21:00)
    - cron: "0 21 * * *"
    # JST 14:00 (UTC 05:00)
    - cron: "0 5 * * *"
    # JST 22:00 (UTC 13:00)
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-service-patrol-${{ github.ref }}
  cancel-in-progress: false

jobs:
  support-service-patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run SUPPORT_SERVICE patrol
        run: npm run patrol:support-service

      - name: Run validation tests
        run: npm test

      - name: Upload SUPPORT_SERVICE patrol artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-service-patrol-${{ github.run_id }}
          path: |
            data/support_service_discovery/support_service_patrol_log.json
            data/support_service_discovery/support_service_change_queue.json
            data/candidates/support_service_candidates.json
          if-no-files-found: error
