name: Publish Patrol Public Status

on:
  workflow_dispatch:
    inputs:
      apply_approved:
        description: Apply reviewed data/approved/*.json before publish
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Restore patrol snapshot cache
        uses: actions/cache@v4
        with:
          path: |
            monitor/reports/snapshots.json
            monitor/reports/emergency-snapshots.json
            monitor/reports/infrastructure-snapshots.json
          key: patrol-snapshots-${{ github.ref }}
          restore-keys: |
            patrol-snapshots-${{ github.ref }}
            patrol-snapshots-refs/heads/main

      - name: Seed patrol snapshots when cache is cold
        run: node scripts/seed-patrol-snapshots.js

      - name: Publish patrol pipeline
        run: |
          set -e
          ARGS="--publish-status"
          if [ "${{ github.event.inputs.apply_approved }}" = "true" ]; then
            ARGS="$ARGS --apply-approved"
          fi
          node scripts/publish-patrol-pipeline.js $ARGS

      - name: Validate public status
        run: node scripts/validate-public-status.js

      - name: Commit public patrol status
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/status.json
          if [ "${{ github.event.inputs.apply_approved }}" = "true" ]; then
            git add data/public/phase1_updates.json data/public/communication_status.json data/public/disaster_locations.json data/public/infrastructure_status.json || true
          fi
          if git diff --cached --quiet; then
            echo "NO_PUBLIC_STATUS_CHANGES"
            exit 0
          fi
          git commit -m "chore(public): publish patrol status and reviewed updates"
          git push
