name: X Feed Sync and Portal Publish

on:
  schedule:
    # Backup sync when repository_dispatch from x-feed fetch fails or is delayed (UTC :15/:45)
    - cron: "15,45 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - x-feed-updated

concurrency:
  group: portal-x-feed-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-x-feed:
    runs-on: ubuntu-latest
    outputs:
      sync_status: ${{ steps.sync.outputs.sync_status }}
      has_preview: ${{ steps.sync.outputs.has_preview }}
    steps:
      - name: Log sync trigger
        run: |
          echo "SYNC_TRIGGER=${{ github.event_name }}"
          echo "WORKFLOW_RUN_ID=${{ github.run_id }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "DISPATCH_SOURCE=${{ github.event.client_payload.source }}"
            echo "DISPATCH_UPDATED_AT=${{ github.event.client_payload.updated_at }}"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Sync x feed preview from upstream posts.json
        id: sync
        env:
          X_FEED_FAIL_OPEN: "true"
        run: npm run sync:x-feed

      - name: Upload x feed preview artifact
        if: steps.sync.outputs.has_preview == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x-feed-preview
          path: data/public/x_feed_preview.json
          if-no-files-found: error

  publish-x-feed-preview:
    needs: sync-x-feed
    if: >-
      always() &&
      (needs.sync-x-feed.result == 'success' || needs.sync-x-feed.outputs.sync_status == 'FAIL_OPEN') &&
      needs.sync-x-feed.outputs.has_preview == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log publish context
        run: |
          echo "SYNC_STATUS=${{ needs.sync-x-feed.outputs.sync_status }}"
          echo "HAS_PREVIEW=${{ needs.sync-x-feed.outputs.has_preview }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Download x feed preview artifact
        uses: actions/download-artifact@v4
        with:
          name: x-feed-preview
          path: data/public

      - name: Validate x feed preview JSON
        run: npm run validate:x-feed

      - name: Build portal static assets
        run: npm run build

      - name: Verify Render auto-deploy configuration
        run: |
          test -f render.yaml
          grep -q "autoDeploy: true" render.yaml
          echo "RENDER_AUTO_DEPLOY=true"

      - name: Commit and push portal public data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/x_feed_preview.json
          STAGED="$(git diff --cached --name-only)"
          if [ -z "$STAGED" ]; then
            echo "NO_X_FEED_CHANGES"
            echo "RENDER_DEPLOY_SKIPPED=true"
            exit 0
          fi
          node scripts/verify-public-commit-staging.js
          git commit -m "chore: sync x feed preview"
          git push
          echo "PORTAL_PUBLISH_PUSHED=true"
          echo "RENDER_DEPLOY_TRIGGERED=true"
